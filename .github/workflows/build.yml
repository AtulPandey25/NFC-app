name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Ensure Release Keystore
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating release.jks..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias nfcplayer \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Atul Patel, OU=Audio, O=Personal, L=Delhi, ST=Delhi, C=IN" \
              -storepass "AtulAudio2026" \
              -keypass "AtulAudio2026"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/release.jks
            git commit -m "Add release keystore [skip ci]" || echo "No changes to commit"
            git push origin ${{ github.ref_name }} || echo "Could not push keystore, continuing..."
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nfc-audio-player-release
          path: app/build/outputs/apk/release/app-release.apk
